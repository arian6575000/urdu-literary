name: Build Android APK

# Manual run only: GitHub -> Actions -> "Build Android APK" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Urdu font (Alvi Nastaleeq)
        run: node scripts/copy-font.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        shell: bash
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | tee ../gradle-build.log

      - name: Report build errors (annotations)
        if: failure()
        shell: bash
        run: |
          if [ -f gradle-build.log ]; then
            enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
            A=$(grep -E "^e: |error:|Execution failed|What went wrong|Caused by" gradle-build.log | head -c 3500 | enc)
            B=$(grep -E -A14 "What went wrong" gradle-build.log | head -c 3500 | enc)
            echo "::error title=Gradle errors::$A"
            echo "::error title=Gradle what went wrong::$B"
          else
            echo "::error::gradle-build.log missing"
          fi

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrduLiterary-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Urdu Literary APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
